name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name ShippingDataValidation_V1.1.1 src/main.py --paths src
      - uses: actions/upload-artifact@v4
        with:
          name: ShippingDataValidation_V1.1.1
          path: dist/ShippingDataValidation_V1.1.1.exe
